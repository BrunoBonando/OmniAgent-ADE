name: Sync instruction docs

on:
  push:
    paths:
      - '.github/copilot-instructions.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'

jobs:
  sync:
    name: Sync agent docs from copilot-instructions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Sync agent docs
        env:
          GIT_COMMITTER_NAME: 'copilot-sync'
          GIT_COMMITTER_EMAIL: 'copilot-sync@users.noreply.github.com'
        run: |
          set -euo pipefail
          AUTH_FILE='.github/copilot-instructions.md'
          changed=false

          for dst in AGENTS.md CLAUDE.md; do
            echo "Generating $dst from $AUTH_FILE"
            {
              echo "<!-- GENERATED from $AUTH_FILE — do not edit directly. Update $AUTH_FILE instead. -->"
              echo
              cat "$AUTH_FILE"
            } > /tmp/generated_$dst

            if [ ! -f "$dst" ] || ! cmp -s "/tmp/generated_$dst" "$dst"; then
              mv /tmp/generated_$dst "$dst"
              git add "$dst"
              changed=true
            else
              rm /tmp/generated_$dst
            fi
          done

          if [ "$changed" = true ]; then
            git config user.name "$GIT_COMMITTER_NAME"
            git config user.email "$GIT_COMMITTER_EMAIL"
            git commit -m "chore: sync agent docs from .github/copilot-instructions.md

Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          else
            echo "No changes to sync"
          fi
