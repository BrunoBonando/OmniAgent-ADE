		C00000000000000000000001 /* Embed PTY Daemon + LaunchAgent Plists (non-Debug) */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
				"$(SRCROOT)/../target/native-macos-embed/omniagent-pty-daemon",
				"$(SRCROOT)/../target/native-macos-embed/$(PRODUCT_BUNDLE_IDENTIFIER).pty-daemon.plist",
			);
			name = "Embed PTY Daemon + LaunchAgent Plists (non-Debug)";
			outputPaths = (
				"$(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/omniagent-pty-daemon",
				"$(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/$(PRODUCT_BUNDLE_IDENTIFIER).pty-daemon.plist",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = "/bin/sh";
			shellScript = "if [ \"$CONFIGURATION\" = \"Debug\" ]; then\n  echo \"note: skipping daemon binary + LaunchAgent plist embed for the Debug configuration (no Rust toolchain required for plain builds/tests).\"\n  exit 0\nfi\nSTAGE=\"$SRCROOT/../target/native-macos-embed\"\nDEST_MACOS=\"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/MacOS\"\nDEST_LAUNCH_AGENTS=\"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents\"\n# Exactly ONE plist: this bundle's own channel. embed-daemon.sh stages both\n# (production and preview) and this phase used to copy both, which put the\n# preview plist -- which bakes in the BUILD MACHINE's literal $HOME under\n# EnvironmentVariables -- inside notarized production artifacts shipped to\n# other people (final whole-branch review, Minor #5). The name is derived\n# from PRODUCT_BUNDLE_IDENTIFIER, the same \"<bundle id>.pty-daemon\" rule\n# DaemonPaths.resolve/DaemonLaunchAgentPlist apply in Swift\n# (macos/OmniAgent/DaemonPersistence.swift).\nPLIST=\"$PRODUCT_BUNDLE_IDENTIFIER.pty-daemon.plist\"\nif [ ! -x \"$STAGE/omniagent-pty-daemon\" ]; then\n  echo \"error: $STAGE/omniagent-pty-daemon not found. Run macos/embed-daemon.sh (or macos/build.sh universal) before building the $CONFIGURATION configuration.\" >&2\n  exit 1\nfi\nif [ ! -f \"$STAGE/$PLIST\" ]; then\n  echo \"error: $STAGE/$PLIST not found. Run macos/embed-daemon.sh (or macos/build.sh universal) before building the $CONFIGURATION configuration.\" >&2\n  exit 1\nfi\nmkdir -p \"$DEST_MACOS\" \"$DEST_LAUNCH_AGENTS\"\ncp -f \"$STAGE/omniagent-pty-daemon\" \"$DEST_MACOS/omniagent-pty-daemon\"\nchmod 755 \"$DEST_MACOS/omniagent-pty-daemon\"\n# Drop anything an earlier build of the *other* channel left in an\n# incremental build directory, so a bundle can never end up carrying two.\nrm -f \"$DEST_LAUNCH_AGENTS\"/*.plist\ncp -f \"$STAGE/$PLIST\" \"$DEST_LAUNCH_AGENTS/$PLIST\"\nchmod 644 \"$DEST_LAUNCH_AGENTS/$PLIST\"\n";
		};
/* End PBXShellScriptBuildPhase section */

