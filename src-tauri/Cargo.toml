[package]
name = "omniagent-ade"
version = "2026.8.17+009"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "omniagent_ade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Task 8.1: FirstRun's native folder picker ("Where do your projects
# live?").
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Every `claude` pane owns a conversation whose id OmniAgent derives, rather
# than letting `--continue` guess "most recent in this directory" (see
# `sessions.rs`, "Every claude pane owns its own conversation"). `v5` is the
# name-based, SHA-1 derivation that makes an OmniAgent session id map to the
# same conversation UUID forever, with no extra state to persist.
uuid = { version = "1", features = ["v5"] }
brain-core = { path = "../crates/brain-core" }
mcp-server = { path = "../crates/mcp-server" }
# Task 7.1: the app now ticks brain-ingest's enrichment drain loop itself
# (see lib.rs's background thread) — previously only a dev-dependency for
# map_feed.rs's tests, which ingested the fixture to exercise the map feed.
brain-ingest = { path = "../crates/brain-ingest" }
omniagent-pty-daemon = { path = "../crates/omniagent-pty-daemon" }
which = "6.0"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
libc = "0.2"
portable-pty = "0.9"
# `tauri::test::mock_app()` — lets the window title be asserted against the
# version a real Tauri app handle reports, so "the title's version is the one
# tauri.conf.json declares" is a test rather than a promise.
tauri = { version = "2", features = ["test"] }
