[package]
name = "omniagent-pty-daemon"
version = "0.1.0"
edition = "2021"

[lib]
name = "omniagent_pty_daemon"
path = "src/lib.rs"

[[bin]]
name = "omniagent-pty-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
vt100 = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
brain-core = { path = "../brain-core" }
mcp-server = { path = "../mcp-server" }
# Task 6a-2: routes roots.rs's onboarding/ingestion/degradation surface
# (add/rename/pause/reingest/rebuild/staleness) through the daemon, reusing
# brain-ingest::roots's Tauri-independent extraction rather than
# re-deriving a second implementation of that state machine here.
brain-ingest = { path = "../brain-ingest" }
# relay.rs: the outbound WebSocket to the relay (spec §1/§3). TLS is rustls with
# the bundled webpki roots; `rustls` is a direct dependency only to pin the
# `ring` crypto provider so `wss://` connects cannot panic on "no process-level
# CryptoProvider" regardless of what the rest of the graph enables.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = "1"
# connections.rs: `since` on the presence roster is RFC 3339 on the wire.
# Same pin as brain-core's, so this adds a direct edge to a crate the
# workspace already builds rather than a new dependency.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.26"
