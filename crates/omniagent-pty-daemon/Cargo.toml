[package]
name = "omniagent-pty-daemon"
version = "0.1.0"
edition = "2021"

[lib]
name = "omniagent_pty_daemon"
path = "src/lib.rs"

[[bin]]
name = "omniagent-pty-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
vt100 = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
brain-core = { path = "../brain-core" }

[dev-dependencies]
tempfile = "3"
