[package]
name = "brain-ingest"
version.workspace = true
edition.workspace = true

[dependencies]
brain-core = { path = "../brain-core" }
ignore = "0.4"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tree-sitter-go = "0.23.4"
regex = "1.13.1"
once_cell = "1.21.4"
# File tree write-side (Part A, founder feedback 2026-07-25: "make sure the
# file view works correctly ... exactly like the Finder from Mac OS").
# `delete_to_trash` in `fileops.rs` goes through this crate exclusively —
# never `std::fs::remove_file`/`remove_dir_all` — so a "deleted" file always
# lands in the real macOS Trash, never a permanent unlink.
trash = "5"
# Import-detection (Part A, founder ask 2026-07-25: detect other dev tools'
# known project lists so a new user doesn't add folders one at a time).
# `import_detect.rs` reads VS-Code-family (VS Code / Cursor) `state.vscdb`
# SQLite files — a foreign app's own DB, unrelated to this crate's own
# `brain_core::Store`, so it gets its own dependency here rather than
# routing through `brain-core` (which stays scoped to the brain's own
# storage model). Same version + "bundled" feature `brain-core` already
# uses, so the workspace only ever links one vendored libsqlite3; "backup"
# is left off since this module only ever runs read-only queries.
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "brain"
path = "src/bin/brain.rs"

[dev-dependencies]
# Test-only, deliberately NOT a production dependency: `mcp-server` is the
# frozen public MCP contract, a layer *above* ingestion, so this crate
# depending on it inverted the intended layering (final whole-branch review,
# Minor #6). The one production use — the `project_label:` settings key —
# now lives in `brain-core`, which both crates already sit on. What remains
# here is a single cross-seam test
# (`rename_project_survives_a_simulated_reingest_that_resets_the_nodes_own_label`)
# asserting that a rename written by this crate is what
# `mcp_server::tools::list_projects` actually renders; a dev-dependency does
# not propagate to `omniagent-pty-daemon`, so the shipped
# dependency graph no longer has the inversion.
mcp-server = { path = "../mcp-server" }
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
