[package]
name = "brain-ingest"
version.workspace = true
edition.workspace = true

[dependencies]
brain-core = { path = "../brain-core" }
ignore = "0.4"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tree-sitter-go = "0.23.4"
regex = "1.13.1"
once_cell = "1.21.4"
# File tree write-side (Part A, founder feedback 2026-07-25: "make sure the
# file view works correctly ... exactly like the Finder from Mac OS").
# `delete_to_trash` in `fileops.rs` goes through this crate exclusively —
# never `std::fs::remove_file`/`remove_dir_all` — so a "deleted" file always
# lands in the real macOS Trash, never a permanent unlink.
trash = "5"

[[bin]]
name = "brain"
path = "src/bin/brain.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
