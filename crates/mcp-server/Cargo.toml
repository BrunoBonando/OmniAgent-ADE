[package]
name = "mcp-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "omniagent-mcp"
path = "src/main.rs"

[dependencies]
brain-core = { path = "../brain-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
